name: AutoSpoofVN
options:
  bundleIdPrefix: com.autospoof
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Debug-FFI: debug
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
targets:
  AutoSpoofVN:
    type: application
    platform: iOS
    sources:
      - path: AutoSpoofVN
        excludes:
          - "**/Info.plist"
          - AutoSpoofWidgets
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
      - path: Vendor/idevice/idevice_stub.c
        buildPhase: none
      - path: Vendor/idevice/ffi
        buildPhase: none
    dependencies:
      - target: AutoSpoofWidgets
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.autospoof.vn
        PRODUCT_NAME: AutoSpoofVN
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: AutoSpoofVN/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoSpoofVN/Resources/AutoSpoofVN.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) USE_IDEVICE_FFI"
      configs:
        Debug-FFI:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) USE_IDEVICE_FFI"

  AutoSpoofVNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AutoSpoofVNTests
    dependencies:
      - target: AutoSpoofVN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autospoof.vn.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"

  AutoSpoofWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoSpoofWidgets
      - path: AutoSpoofVN/Sources/Models/ActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autospoof.vn.widgets
        PRODUCT_NAME: AutoSpoofWidgets
        INFOPLIST_FILE: AutoSpoofWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
