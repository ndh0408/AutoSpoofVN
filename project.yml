name: LocationX
options:
  bundleIdPrefix: com.nguyenduchuy
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    # Chi iPhone: giao dien khoa doc, khai bao them iPad gay canh bao orientation.
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    # Dat o day (project-wide) de app va widget extension LUON cung version - Apple bat buoc
    # CFBundleVersion cua app extension phai khop voi app cha, khac se bi tu choi khi archive.
    # scripts/bump_version.sh chi can sua 1 cho nay.
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
schemes:
  # Scheme duy nhat. Chay tren simulator hoac may that deu duoc.
  #
  # Viec gia lap vi tri di theo duong Shadowrocket: app chay CoordinateServer o
  # 127.0.0.1:8765, module MITM cua Shadowrocket doc toa do tu do va ghi de response
  # cua Apple Location Service. Khong con phu thuoc libidevice_ffi.a nua.
  LocationX:
    build:
      targets:
        LocationX: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocationXTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  LocationX:
    type: application
    platform: iOS
    sources:
      - path: LocationX
        excludes:
          - "**/Info.plist"
          - LocationXWidgets
      # Script MITM duoc dong goi thanh tai nguyen de CoordinateServer phuc vu ban
      # realtime. Mot nguon su that duy nhat voi ban tren GitHub.
      - path: Proxy/location-spoofer.js
        buildPhase: resources
    dependencies:
      - target: LocationXWidgets
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyenduchuy.locationx
        PRODUCT_NAME: LocationX
        INFOPLIST_FILE: LocationX/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocationX/Resources/LocationX.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

      configs:
        # Ban Release dung entitlements KHONG co `get-task-allow`. Giu co do trong ban
        # archive la bi App Store tu choi.
        Release:
          CODE_SIGN_ENTITLEMENTS: LocationX/Resources/LocationX.Release.entitlements

  LocationXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocationXTests
    dependencies:
      - target: LocationX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyenduchuy.locationx.tests
        # Bat buoc khai bao: khong co dong nay PRODUCT_NAME rong, test bundle build ra
        # "LocationX.app/PlugIns/.xctest" va Xcode bao "Multiple commands produce".
        PRODUCT_NAME: LocationXTests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"

  LocationXWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LocationXWidgets
      - path: LocationX/Sources/Models/ActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyenduchuy.locationx.widgets
        PRODUCT_NAME: LocationXWidgets
        INFOPLIST_FILE: LocationXWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
