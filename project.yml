name: AutoSpoofVN
options:
  bundleIdPrefix: com.autospoof
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
targets:
  AutoSpoofVN:
    type: application
    platform: iOS
    sources:
      - path: AutoSpoofVN
        excludes:
          - "**/Info.plist"
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autospoof.vn
        PRODUCT_NAME: AutoSpoofVN
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: AutoSpoofVN/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoSpoofVN/Resources/AutoSpoofVN.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
