name: AutoSpoofVN
options:
  bundleIdPrefix: com.autospoof
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Debug-FFI: debug
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"   # chi iPhone: MainView khoa doc, khai bao 1,2 gay warning orientation iPad
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    # Dat o day (project-wide) de app va widget extension LUON cung version - Apple bat buoc
    # CFBundleVersion cua app extension phai khop voi app cha, khac se bi tu choi khi archive.
    # scripts/bump_version.sh chi can sua 1 cho nay.
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
schemes:
  # Chay tren simulator hoac may that deu duoc. GPS KHONG doi that - dung de xem giao dien,
  # thu route/scenario/routine/lich su. Day la scheme mac dinh khi mo project.
  AutoSpoofVN-Mock:
    build:
      targets:
        AutoSpoofVN: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AutoSpoofVNTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
  # Can libidevice_ffi.a THAT (build theo BUILD.md muc 6) va chi chay duoc tren
  # THIET BI THAT cam day (thu vien bien dich cho arm64-apple-ios, khong co ban simulator).
  # Con can: pairing record, Developer Mode, VPN loopback - xem BUILD.md muc 7.
  AutoSpoofVN-RealFFI:
    build:
      targets:
        AutoSpoofVN: all
    run:
      config: Debug-FFI
    test:
      config: Debug-FFI
      targets:
        - AutoSpoofVNTests
    profile:
      config: Debug-FFI
    analyze:
      config: Debug-FFI
    archive:
      config: Release

targets:
  AutoSpoofVN:
    type: application
    platform: iOS
    sources:
      - path: AutoSpoofVN
        excludes:
          - "**/Info.plist"
          - AutoSpoofWidgets
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
      - path: Vendor/idevice/idevice_stub.c
        buildPhase: none
      - path: Vendor/idevice/ffi
        buildPhase: none
    dependencies:
      - target: AutoSpoofWidgets
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # chi iPhone (preset iOS cua XcodeGen mac dinh 1,2 gay warning orientation)
        PRODUCT_BUNDLE_IDENTIFIER: com.autospoof.vn
        PRODUCT_NAME: AutoSpoofVN
        INFOPLIST_FILE: AutoSpoofVN/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoSpoofVN/Resources/AutoSpoofVN.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
      configs:
        # Chi cau hinh nay moi link thu vien that. Debug/Release la mock, chay duoc
        # tren simulator x86_64 va tren may bat ky khong co libidevice_ffi.a.
        Debug-FFI:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) USE_IDEVICE_FFI"
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-lidevice_ffi"

  AutoSpoofVNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AutoSpoofVNTests
    dependencies:
      - target: AutoSpoofVN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autospoof.vn.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"

  AutoSpoofWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoSpoofWidgets
      - path: AutoSpoofVN/Sources/Models/ActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autospoof.vn.widgets
        PRODUCT_NAME: AutoSpoofWidgets
        INFOPLIST_FILE: AutoSpoofWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
