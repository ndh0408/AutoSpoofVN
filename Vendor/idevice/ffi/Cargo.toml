[package]
name = "idevice_ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "idevice_ffi"
crate-type = ["staticlib"]

[dependencies]
idevice = { version = "0.1.65", default-features = false, features = [
  "aws-lc", "tcp", "core_device_proxy", "tunnel_tcp_stack", "rsd", "xpc",
  "dvt", "location_simulation", "heartbeat", "mobile_image_mounter", "pair", "tss"
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[profile.release]
opt-level = "z"
lto = true
